site_name: colombian-grid
site_url: https://jccamargo94.github.io/colombian-grid/
repo_url: https://github.com/jccamargo94/colombian-grid

docs_dir: docs

theme:
  name: material
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.indexes
    - content.tabs
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Cambiar a modo oscuro
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Cambiar a modo claro

plugins:
  # resolve_closest is required: mkdocs-static-i18n runs one full mkdocs build pass per
  # locale in the same process, and mkdocs-autorefs shares one global anchor registry
  # across those passes. Since api-reference.es.md/api-reference.en.md both render the
  # same Python symbols via mkdocstrings, autorefs sees each symbol anchored twice and
  # `mkdocs build --strict` fails with "Multiple primary URLs found" unless this is set.
  # Do not remove this without re-testing `uv run mkdocs build --strict`.
  - autorefs:
      resolve_closest: true
  - mkdocstrings:
      handlers:
        python:
          selection:
            docstring_style: google  # Usar estilo Google para docstrings
          rendering:
            show_root_heading: true
            show_source: true
  - search:
      lang: [es, en]
      separator: '[\s\-\.]+'
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: es
          name: Español
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Inicio: Home
            Comenzando: Getting Started
            Referencia API: API Reference
            Ejemplos: Examples

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Inicio: index.md
  - Comenzando: getting-started.md
  - Referencia API: api-reference.md
  - Ejemplos: examples.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jccamargo94/colombian-grid
    - icon: fontawesome/solid/book
      link: https://jccamargo94.github.io/colombian-grid/

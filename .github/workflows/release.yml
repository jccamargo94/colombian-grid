name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    # semantic-release pushes the version bump commit and tag to main
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pdm
          pdm install

      - name: Configure git
        run: |
          git config --global user.name "semantic-release"
          git config --global user.email "semantic-release@users.noreply.github.com"

      - name: Run semantic-release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # main is fully protected (no actor may update it directly), so
          # semantic-release commits + tags locally and we publish only the
          # tag ref plus the GitHub Release. Tags are outside branch
          # protection; the bumped pyproject/CHANGELOG travel inside the tag.
          pdm run semantic-release version --no-push
          TAG="$(git tag --points-at HEAD | head -n1)"
          if [ -n "$TAG" ]; then
            git push origin "refs/tags/${TAG}"
            gh release create "${TAG}" --verify-tag --generate-notes
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  publish-pypi:
    needs: release
    # Skips on pushes that produced no release (no new tag)
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    # Protected environment: restricted to main, requires manual approval
    environment: pypi
    permissions:
      id-token: write # Required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          pip install pdm
          pdm build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
